name: Bug report
description: 不具合の報告
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとう。
        再現しやすいように、できるだけ具体的に書いてください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを簡潔に書いてください
      placeholder: 例) ログインボタンを押しても反応しない
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現する手順
      placeholder: |
        1. `/login` にアクセス
        2. メールアドレスを入力
        3. ログインボタンを押す
        4. 何も起きない
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      placeholder: 例) ダッシュボードに遷移する
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 影響度
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 環境
      description: OS / Browser / App version など
      placeholder: 例) macOS 15 / Chrome 135 / v1.2.3

  - type: textarea
    id: logs
    attributes:
      label: スクリーンショット・ログ
      description: エラー文や画像があれば貼ってください
      placeholder: エラーログやスクショをここに貼る
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: 既存Issueを確認しました
          required: true
        - label: 再現手順をできるだけ具体的に書きました
          required: true
