name: Feature request
description: 新機能や改善の提案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能の提案ありがとう。
        「何を」「なぜ」入れたいのかが分かると判断しやすいです。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 今どんな問題がある？
      placeholder: 例) 現状は一覧の絞り込みができず、目的のデータを探しにくい
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どんな機能を追加・改善したい？
      placeholder: 例) タグ・作成日・状態でフィルタできる機能を追加したい
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 期待される効果
      description: その機能で何が良くなる？
      placeholder: 例) 必要なデータにすぐ辿り着けて作業時間が減る
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に考えた方法があれば書いてください
      placeholder: 例) ソートだけでもある程度対応可能だが不十分

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - low
        - medium
        - high
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: 参考リンク、モック、補足など
      placeholder: Figma, スクショ, 参考Issue など
