name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 許可する type 一覧（CONTRIBUTING.md と同期）
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            revert
          # scope は任意
          requireScope: false
          # subject（description）が小文字で始まることを強制しない
          subjectPattern: ^.+$
          subjectPatternError: |
            PR タイトルの subject が空です。
            例）feat(auth): Google OAuth によるログイン機能を追加
          # wip / draft PR はスキップ
          ignoreLabels: |
            wip
            draft
